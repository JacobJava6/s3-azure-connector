apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: s3-azure-connector-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s3-azure-connector

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70